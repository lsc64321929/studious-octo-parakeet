<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>欢迎来点歌</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#0f1419;color:#e8eef5;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:16px 14px}
h1{font-size:26px;margin-bottom:4px}
.remark{color:#b8c2d0;font-size:13px;background:#16202e;border:1px solid #263040;border-radius:8px;padding:8px 12px;margin-bottom:12px;line-height:1.6}
.sub{color:#8a94a6;font-size:13px;margin-bottom:14px}
.bar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px}
.search{flex:1 1 100%;min-width:0;padding:10px 12px;border:1px solid #263040;border-radius:8px;background:#1a2230;color:#e8eef5;font-size:14px;outline:none}
.search::placeholder{color:#8a94a6}
.btn{flex:1 1 auto;min-width:0;padding:9px 6px;border:1px solid #263040;border-radius:8px;background:#1a2230;color:#c8d2e0;font-size:13px;cursor:pointer;text-align:center;word-break:keep-all}
.btn:active{background:#22304a}
.song{padding:12px;border-bottom:1px solid #1e2735;font-size:16px;line-height:1.5;word-break:break-all;display:flex;flex-wrap:wrap;align-items:center;gap:10px}
.song-name{flex:1;min-width:0;word-break:break-all}
.lbtn{flex:0 0 auto;padding:4px 10px;border:1px solid #263040;border-radius:6px;background:#1a2230;color:#c8d2e0;font-size:13px;cursor:pointer}
.lbtn:active{background:#22304a}
.lbtn.open{background:#c8d2e0;color:#1a2230;border-color:#c8d2e0}
.song.open{position:sticky;top:0;background:#0f1419;z-index:5;box-shadow:0 2px 8px rgba(0,0,0,.45)}
.ldrawer{flex-basis:100%;width:100%;display:none;margin-top:10px;padding:10px 12px;background:#131a24;border:1px solid #263040;border-radius:8px}
.ldrawer.open{display:block}
.ldtool{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.ldminus,.ldplus{flex:0 0 auto;padding:2px 10px;border:1px solid #263040;border-radius:6px;background:#1a2230;color:#c8d2e0;font-size:14px;cursor:pointer}
.ldminus:active,.ldplus:active{background:#22304a}
.ldsize{font-size:12px;color:#8a94a6;min-width:24px;text-align:center}
.ldbody{font-size:14px;line-height:2.0;color:#d6dee8;white-space:pre-wrap;word-break:break-word}
.none{color:#8a94a6;font-size:14px;padding:24px 0;text-align:center}
</style>
</head>
<body>
<div class="wrap">
<h1 id="title">欢迎来点歌</h1>
<div class="remark" id="remark"></div>
<div class="sub" id="sub">加载中…</div>
<div class="bar">
<input type="search" class="search" id="searchInput" placeholder="搜索歌曲名或歌手名">
<button class="btn" id="sortBtn" type="button">按歌曲名</button>
</div>
<div id="list"></div>
</div>
<script>
(function(){
  var DATA='data.json';
  var OPT_KEY='sujipu_view_opt';
  var opt={sort:'title'};
  try{ var _s=localStorage.getItem(OPT_KEY); if(_s){ var _o=JSON.parse(_s); if(_o&&(_o.sort==='title'||_o.sort==='artist')) opt.sort=_o.sort; } }catch(e){}
  var lyricSize=14;
  try{ var _ls=localStorage.getItem('sujipu_view_lyric_size'); if(_ls){ var _n=parseInt(_ls,10); if(_n&&_n>=12&&_n<=32) lyricSize=_n; } }catch(e){}
  function saveLyricSize(){ try{ localStorage.setItem('sujipu_view_lyric_size', String(lyricSize)); }catch(e){} }
  function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
  var _cache=null;
  function saveOpt(){ try{ localStorage.setItem(OPT_KEY, JSON.stringify(opt)); }catch(e){} }
  function songLine(s){
    var t=esc((s&&s.title)||''), a=esc((s&&s.artist)||'');
    if(!a) return t;
    return (opt.sort==='artist') ? (a+' - '+t) : (t+' - '+a);
  }
  function render(){
    var el=document.getElementById('list');
    if(!_cache){ el.innerHTML='<div class="none">加载中…</div>'; return; }
    var songs=_cache.slice();
    songs.sort(function(x,y){
      var a=opt.sort==='artist' ? String(x.artist||'') : String(x.title||'');
      var b=opt.sort==='artist' ? String(y.artist||'') : String(y.title||'');
      var c=a.localeCompare(b,'zh-CN',{numeric:true});
      if(c!==0) return c;
      return String(x.title||'').localeCompare(String(y.title||''),'zh-CN',{numeric:true});
    });
    var q=(document.getElementById('searchInput').value||'').trim().toLowerCase();
    if(q){
      songs=songs.filter(function(x){ var t=String(x.title||'').toLowerCase(), a=String(x.artist||'').toLowerCase(); return t.indexOf(q)>=0||a.indexOf(q)>=0; });
      if(!songs.length){ el.innerHTML='<div class="none">没有找到与「'+esc(q)+'」相关的歌曲</div>'; return; }
    }
    if(!songs.length){ el.innerHTML='<div class="none">歌单还是空的</div>'; return; }
    var html='';
    songs.forEach(function(s,i){
      var _ly=String((s&&s.lyrics)||'').trim();
      html+='<div class="song'+(s._open?' open':'')+'">';
      html+='<span class="song-name">'+songLine(s)+'</span>';
      if(_ly){
        html+='<button class="lbtn'+(s._open?' open':'')+'" data-i="'+i+'" type="button">歌词</button>';
        html+='<div class="ldrawer'+(s._open?' open':'')+'">';
        html+='<div class="ldtool"><button class="ldminus" data-i="'+i+'" type="button">-</button><span class="ldsize">'+lyricSize+'</span><button class="ldplus" data-i="'+i+'" type="button">+</button></div>';
        html+='<div class="ldbody" style="font-size:'+lyricSize+'px">'+esc(_ly)+'</div>';
        html+='</div>';
      }
      html+='</div>';
    });
    el.innerHTML=html;
    _lastSongs=songs;
  }
  function load(){
    fetch(DATA+'?t='+Date.now()).then(function(r){ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); }).then(function(d){
      document.getElementById('sub').textContent='更新于 '+(d.updated||'未知');
      var ti=document.getElementById('title'); if(ti){ ti.textContent=d.title||'欢迎来点歌'; document.title=ti.textContent; }
      var rm=document.getElementById('remark'); if(rm) rm.textContent=d.remark||'如果你想点歌，请与乐手或者工作人员联系。';
      var pls=d.playlists||{};
      var names=Object.keys(pls);
      var songs=[];
      names.forEach(function(k){ (pls[k]||[]).forEach(function(s){ songs.push(s); }); });
      var seen={}, uniq=[];
      songs.forEach(function(s){
        var t=String((s&&s.title)||'').trim(), a=String((s&&s.artist)||'').trim();
        var key=t+'\u0001'+a;
        if(!t||seen[key]) return;
        seen[key]=true; uniq.push({title:t, artist:a, lyrics: String((s&&s.lyrics)||'')});
      });
      _cache=uniq;
      render();
    }).catch(function(e){
      document.getElementById('list').innerHTML='<div class="none">加载失败：'+(e&&e.message||'网络异常')+'</div>';
      document.getElementById('sub').textContent='';
    });
  }
  var sortBtn=document.getElementById('sortBtn');
  function syncBtns(){
    sortBtn.textContent=opt.sort==='artist'?'按歌手名':'按歌曲名';
  }
  sortBtn.addEventListener('click', function(){ opt.sort=(opt.sort==='title')?'artist':'title'; saveOpt(); syncBtns(); render(); });
  var searchInput=document.getElementById('searchInput');
  if(searchInput) searchInput.addEventListener('input', render);
  syncBtns();
  var _lastSongs=[];
  var listEl=document.getElementById('list');
  if(listEl){ listEl.addEventListener('click', function(e){
    var t=e.target;
    if(t.classList&&t.classList.contains('lbtn')){
      var i=parseInt(t.getAttribute('data-i'),10); var s=_lastSongs[i]; if(!s) return;
      s._open=!s._open; render();
    } else if(t.classList&&t.classList.contains('ldplus')){
      if(lyricSize<32){ lyricSize+=2; saveLyricSize(); render(); }
    } else if(t.classList&&t.classList.contains('ldminus')){
      if(lyricSize>12){ lyricSize-=2; saveLyricSize(); render(); }
    }
  }); }
  load();
})();
</script>
</body>
</html>
